<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trader's Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- AUTH VIEW -->
<div id="authView" class="auth-shell">
  <div class="auth-card card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
      <div class="brand-mark"></div>
      <div style="font-weight:800;font-size:17px;">Trader's Hub</div>
    </div>
    <div class="auth-tabs">
      <div id="tabLogin" class="active">Log in</div>
      <div id="tabRegister">Register</div>
    </div>
    <div id="authError" class="error-box"></div>

    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" required></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" required></div>
      <button class="btn" style="width:100%;" type="submit">Log in</button>
    </form>

    <form id="registerForm" style="display:none;">
      <div class="field"><label>Username</label><input type="text" id="regUsername" required></div>
      <div class="field"><label>Email</label><input type="email" id="regEmail" required></div>
      <div class="field"><label>Password (min 8 characters)</label><input type="password" id="regPassword" minlength="8" required></div>
      <button class="btn" style="width:100%;" type="submit">Create account</button>
    </form>
  </div>
</div>

<!-- DASHBOARD VIEW -->
<div id="dashView" style="display:none;">
  <div class="topbar">
    <div class="brand"><div class="brand-mark"></div>Trader's Hub</div>
    <div class="spacer"></div>
    <span class="who" id="whoami"></span>
    <a href="/admin.html" class="btn secondary" id="adminLink" style="display:none;text-decoration:none;">Admin panel</a>
    <button class="btn secondary" id="logoutBtn">Log out</button>
  </div>

  <div class="wrap grid" style="grid-template-columns:1.4fr 1fr;">
    <div class="grid" style="align-content:start;">
      <div class="card">
        <h2>Live prices <span class="sub">real-time via Alpaca IEX stream</span></h2>
        <table>
          <thead><tr><th>Symbol</th><th>Last</th><th>Bid</th><th>Ask</th><th>Updated</th></tr></thead>
          <tbody id="priceTable"><tr><td colspan="5" class="empty">Waiting for stream…</td></tr></tbody>
        </table>
      </div>

      <div class="card">
        <h2>Order history</h2>
        <table>
          <thead><tr><th>Symbol</th><th>Side</th><th>Qty</th><th>Status</th><th>Submitted</th></tr></thead>
          <tbody id="orderTable"><tr><td colspan="5" class="empty">No orders yet</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="grid" style="align-content:start;">
      <div class="card">
        <h2>Account <span class="sub" id="accountMode"></span></h2>
        <div id="accountBox" class="muted">Loading account…</div>
      </div>

      <div class="card">
        <h2>Place order <span class="sub">submits to Alpaca paper trading</span></h2>
        <div id="orderError" class="error-box"></div>
        <form id="orderForm">
          <div class="field"><label>Symbol</label><input type="text" id="ordSymbol" placeholder="AAPL" required></div>
          <div class="row">
            <div class="field"><label>Side</label>
              <select id="ordSide"><option value="buy">Buy</option><option value="sell">Sell</option></select>
            </div>
            <div class="field"><label>Qty</label><input type="number" id="ordQty" min="0.01" step="0.01" value="1" required></div>
          </div>
          <button class="btn" style="width:100%;" type="submit">Submit order</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
