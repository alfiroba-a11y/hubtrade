<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trader's Hub — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="deniedView" style="display:none;" class="auth-shell">
  <div class="card" style="max-width:380px;text-align:center;">
    <h2 style="margin-bottom:8px;">Admin access required</h2>
    <p class="muted" style="margin-bottom:16px;">You're not signed in as an admin.</p>
    <a href="/" class="btn" style="text-decoration:none;">Back to dashboard</a>
  </div>
</div>

<div id="adminView" style="display:none;">
  <div class="topbar">
    <div class="brand"><div class="brand-mark"></div>Trader's Hub — Admin</div>
    <div class="spacer"></div>
    <a href="/" class="btn secondary" style="text-decoration:none;">Dashboard</a>
    <button class="btn secondary" id="logoutBtn">Log out</button>
  </div>

  <div class="wrap grid">
    <div class="card">
      <h2>Users</h2>
      <table>
        <thead><tr><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th></th></tr></thead>
        <tbody id="userTable"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>

    <div class="card">
      <h2>All orders</h2>
      <table>
        <thead><tr><th>User</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Status</th><th>Submitted</th></tr></thead>
        <tbody id="orderTable"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
